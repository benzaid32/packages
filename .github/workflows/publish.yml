name: Publish Package to packages.atopile.io

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.0)'
        required: true
        default: '0.1.0'

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.release.draft != true && github.event.release.prerelease != true)
    
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      packages: write
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup atopile
        uses: atopile/setup-atopile@v1
        with:
          ato-config: "packages/nxp-pca9685/ato.yaml"
      
      - name: Publish to packages.atopile.io
        uses: atopile/publish-package@main
        with:
          working-directory: "./packages/nxp-pca9685"
          package-version: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || 'from-tag' }}
          skip-duplicate-versions: "true"
        env:
          ATO_CONFIG: "packages/nxp-pca9685/ato.yaml"
